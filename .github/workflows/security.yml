name: Application security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tablebabu_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: tablebabu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tablebabu_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://tablebabu_test:isolated_ci_only@localhost:5432/tablebabu_test
      APP_ORIGIN: http://localhost:3000
      TRUST_PROXY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:generate
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
